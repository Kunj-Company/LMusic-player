name: Build & Release LMusic

# Every push to main builds a signed APK (download it from the run's "Artifacts").
# Pushing a tag like v1.2.0 also publishes a GitHub Release with the APK attached.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The CI signing key is generated once and kept in the Actions cache under this name.
  SIGNING_CACHE_KEY: lmusic-signing-key-v1
  SIGNING_DIR: .lmusic-signing

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ---- Signing -------------------------------------------------------------
      # Preferred: your own key in repository secrets (LMUSIC_KEYSTORE_B64,
      # LMUSIC_KEYSTORE_PASSWORD, LMUSIC_KEY_ALIAS). Without them, a key generated
      # by CI on the first main-branch build is reused from the Actions cache, so
      # every APK is signed the same way and installs as an update.
      - name: Use signing key from secrets
        id: secret-key
        env:
          KEYSTORE_B64: ${{ secrets.LMUSIC_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LMUSIC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LMUSIC_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$SIGNING_DIR"
          echo "$KEYSTORE_B64" | base64 -d > "$SIGNING_DIR/lmusic.jks"
          {
            echo "storeFile=$GITHUB_WORKSPACE/$SIGNING_DIR/lmusic.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Restore CI signing key
        if: steps.secret-key.outputs.found != 'true'
        id: restore-key
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SIGNING_DIR }}
          key: ${{ env.SIGNING_CACHE_KEY }}

      - name: Generate CI signing key (first run only)
        if: steps.secret-key.outputs.found != 'true' && steps.restore-key.outputs.cache-hit != 'true'
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::No signing key yet. Push to main once so CI can create it, then re-run this build."
            exit 1
          fi
          mkdir -p "$SIGNING_DIR"
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -keystore "$SIGNING_DIR/lmusic.jks" -alias lmusic \
            -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=LMusic, O=twilighty-abhi"
          echo "$PASS" > "$SIGNING_DIR/password"

      - name: Save CI signing key
        if: steps.secret-key.outputs.found != 'true' && steps.restore-key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SIGNING_DIR }}
          key: ${{ env.SIGNING_CACHE_KEY }}

      - name: Write signing config from CI key
        if: steps.secret-key.outputs.found != 'true'
        run: |
          PASS="$(cat "$SIGNING_DIR/password")"
          {
            echo "storeFile=$GITHUB_WORKSPACE/$SIGNING_DIR/lmusic.jks"
            echo "storePassword=$PASS"
            echo "keyAlias=lmusic"
            echo "keyPassword=$PASS"
          } > keystore.properties

      # ---- Version -------------------------------------------------------------
      - name: Work out version
        id: version
        run: |
          CODE=$(( GITHUB_RUN_NUMBER + 100 ))
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
          else
            NAME="$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Building LMusic $NAME ($CODE)"

      # ---- Build ---------------------------------------------------------------
      - name: Build release APK
        run: |
          chmod +x gradlew
          # arm64 build only: every Android 15+ phone (including the Galaxy S23) is
          # 64-bit ARM, and it keeps the APK a fraction of the universal size.
          ./gradlew :app:assembleRelease --stacktrace \
            -Ppixelplay.enableAbiSplits=true \
            -PAPP_VERSION_CODE=${{ steps.version.outputs.code }} \
            -PAPP_VERSION_NAME=${{ steps.version.outputs.name }}

      - name: Verify and rename APK
        id: apk
        run: |
          SRC="app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          ls -la app/build/outputs/apk/release/
          OUT="LMusic-${{ steps.version.outputs.name }}.apk"
          cp "$SRC" "$OUT"
          BT="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging "$OUT" | head -n 3
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$OUT" | head -n 4
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LMusic-${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.file }}
          compression-level: 0
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          NOTES_FILE="release-notes/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "$TAG" "${{ steps.apk.outputs.file }}" --title "LMusic ${TAG}" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "${{ steps.apk.outputs.file }}" --title "LMusic ${TAG}" --generate-notes
          fi
